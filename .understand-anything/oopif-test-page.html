<!doctype html>
<!--
  OOPIF 录制真机验证页(手动)。runbook 见 .understand-anything/iframe-capture-plan.md。
  iframe 指向 https://juejin.cn/(与本页 127.0.0.1 跨源 → Chrome 拆成 OOPIF 独立 CDP target)。
  掘金加载后自身会发 feed/推荐等 API 请求 → 应被 capture 录到,entry 带 frameSessionId + frameUrl。
  在 iframe 内点击/滚动/搜索 → 触发更多请求 + UI 事件(带 frameSessionId/frameUrl)。
-->
<html>
<head><meta charset="utf-8"><title>byCLI OOPIF capture test</title></head>
<body style="font-family:system-ui;padding:16px;margin:0">
  <h2 style="margin:0 0 8px">顶层页面(parent · 127.0.0.1)</h2>
  <button id="top-btn" onclick="fetch('https://api.github.com/zen').then(r=>r.text())">
    顶层:发一条 top fetch(api.github.com)
  </button>
  <p style="color:#888;margin:8px 0">下面是<strong>跨源 iframe</strong>(juejin.cn → OOPIF)。它加载即发自身 API:</p>
  <iframe id="cross" src="https://juejin.cn/" width="100%" height="700"
          style="border:2px solid #0aa"></iframe>
</body>
</html>
