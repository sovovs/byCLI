openapi: 3.1.0
info:
  title: Recorder Local Service API
  version: recorder.v1
security:
  - RecorderHeader: []
    ByCliToken: []
    CsrfToken: []
paths:
  /recorder/health:
    get:
      security: []
      responses:
        "200":
          description: health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/session/bind:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionBindRequest"
      responses:
        "200":
          description: session bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/session/confirm-auth:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAuthRequest"
      responses:
        "200":
          description: auth confirmed, session advances to page_ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: invalid state or auth check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/navigate:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigateRequest"
      responses:
        "200":
          description: navigated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: forbidden or invalid navigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/capture/start:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureStartRequest"
      responses:
        "200":
          description: capture started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/capture/read:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureReadRequest"
      responses:
        "200":
          description: capture entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/rank:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankRequest"
      responses:
        "200":
          description: rank candidates produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: invalid state or insufficient samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/analyze:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "202":
          description: analyze request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/init:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRequest"
      responses:
        "200":
          # init is a SHORT synchronous FS write (atomic adapter-draft write), not a long
          # operation — unlike verify (spawns a runner) / analyze (drives the browser), which are
          # 202 + poll GET /recorder/requests/{id}. init returns its result inline, no request record.
          description: >-
            draft written (or dry-run previewed) synchronously; data carries { report, dryRun,
            generatedSource? }. generatedSource = rendered adapter source for dry-run review (LLM
            合成时含生成的 func/columns;feature-gated FEATURE_LLM_SYNTHESIS,否则空骨架)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/verify:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "202":
          description: verify request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: idempotency_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/requests/{requestId}:
    get:
      security:
        - RecorderHeader: []
          ByCliToken: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: waitMs
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStatus"
        "404":
          description: request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /recorder/cancel:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: cancelled or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
components:
  securitySchemes:
    RecorderHeader:
      type: apiKey
      in: header
      name: X-Recorder
      description: "Custom header gate (04 · X-Recorder:1). Browsers cannot set custom headers cross-site; with Origin allowlist + no-CORS this blocks scripted cross-origin calls."
    ByCliToken:
      type: apiKey
      in: header
      name: X-byCLI-Token
      description: "Startup random token, injected into the UI at launch via one-time bootstrap (04 · sessionStorage/IPC)."
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Double-submit CSRF token, REQUIRED on side-effect POSTs only (the two GETs
        health/requests override security to omit it). dashboard-be gates.ts validates
        this header against the bootstrap CSRF token; it does NOT read a cookie, so no
        cookie scheme is declared. The double-submit pairing (header value must equal the
        SameSite cookie) is an implementation contract not expressible in OpenAPI.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      required: [ok, schemaVersion]
      properties:
        ok:
          type: boolean
        schemaVersion:
          type: string
          enum: [recorder.v1]
        requestId:
          type: string
        data:
          type: [object, "null"]
        error:
          oneOf:
            - $ref: "adapter-recorder.bundle.json#/$defs/Error"
            - type: "null"
    RequestStatus:
      type: object
      required: [requestId, type, status, startedAt, updatedAt]
      properties:
        requestId:
          type: string
        type:
          type: string
          enum: [analyze, init, verify, capture, rank]
        status:
          type: string
          enum: [queued, running, succeeded, failed, timeout, cancelled]
        startedAt:
          type: integer
        updatedAt:
          type: integer
        expiresAt:
          type: [integer, "null"]
        pollAfterMs:
          type: [integer, "null"]
        profileId:
          type: [string, "null"]
        queueReason:
          type: [string, "null"]
          enum: [profile_busy, queue_full, null]
        progress:
          type: [object, "null"]
        result:
          # verify → adapter-recorder.bundle.json#/$defs/VerifySummary (M6 landed: be returns it
          # in result for a verify request; daemon-high-level GET /v1/requests/{id} references it).
          # Still a generic object here: the per-type oneOf (RankResult/AnalyzeStatus/InitStatus)
          # stays deferred (M-003) until those summary shapes finalize. See 03 Request Status.
          type: [object, "null"]
        error:
          oneOf:
            - $ref: "adapter-recorder.bundle.json#/$defs/Error"
            - type: "null"
    SessionBindRequest:
      type: object
      required: [contextId, mode]
      properties:
        contextId:
          type: string
        targetId:
          type: [string, "null"]
        profileId:
          type: [string, "null"]
        mode:
          type: string
          enum: [bind_existing_page, create_page_await_user_login, bind_existing_context]
        recordingMode:
          description: >-
            产品录制形态(应用层策略,与底层 mode 区分)。缺省 tab_projection(投屏,向后兼容:
            老客户端不传即投屏)。embedded_iframe(dashboard 嵌跨源 iframe 录制)受
            FEATURE_EMBEDDED_IFRAME_RECORDING gate,flag off 时请求它返回 feature_disabled。
          type: string
          enum: [tab_projection, embedded_iframe]
          default: tab_projection
        authCheck:
          type: [object, "null"]
          properties:
            probeUrl:
              type: string
            expectedSignal:
              type: string
        clientRequestId:
          type: [string, "null"]
    ConfirmAuthRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        authCheck:
          type: [object, "null"]
          properties:
            probeUrl:
              type: string
            expectedSignal:
              type: string
        clientRequestId:
          type: [string, "null"]
    NavigateRequest:
      type: object
      required: [sessionId, url]
      properties:
        sessionId:
          type: string
        url:
          type: string
        targetId:
          type: [string, "null"]
        settleMs:
          type: [integer, "null"]
        clientRequestId:
          type: [string, "null"]
    CaptureStartRequest:
      type: object
      required: [sessionId, sampleName, trigger]
      properties:
        sessionId:
          type: string
        sampleName:
          type: string
          enum: [A, B]
        trigger:
          type: string
          enum: [user_manual, navigate, dom_action_replay]
        actionLabel:
          type: [string, "null"]
        seedArgsEvidence:
          type: [object, "null"]
          additionalProperties:
            $ref: "adapter-recorder.bundle.json#/$defs/EvidenceSeedArg"
        requireDifferentSeedFrom:
          type: [string, "null"]
          enum: [A, null]
        clientRequestId:
          type: [string, "null"]
    CaptureReadRequest:
      type: object
      required: [sessionId, sampleName]
      properties:
        sessionId:
          type: string
        sampleName:
          type: string
          enum: [A, B]
        seed:
          type: string
          description: >-
            可选。本样本声明的搜索关键词(dashboard seed 输入)。be 用它反推携带该值的 query 参数名
            (value→param),再派生**仅 HMAC** 的 seedArgsEvidence 喂给 rank 识别 seed→param(+评分)。
            raw 值仅在 be 处理本请求时内存中使用、用完即弃,**绝不持久化/落盘/出日志**(M7c)。
        clientRequestId:
          type: [string, "null"]
    RankRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        clientRequestId:
          type: [string, "null"]
    AnalyzeRequest:
      type: object
      required: [sessionId, url, contextId]
      properties:
        sessionId:
          type: string
        url:
          type: string
        contextId:
          type: string
        settleMs:
          type: [integer, "null"]
        clientRequestId:
          type: [string, "null"]
    InitRequest:
      type: object
      required: [sessionId, name, writePolicy, selectedCandidateId]
      allOf:
        - if:
            properties:
              writePolicy:
                const: write
            required: [writePolicy]
          then:
            required: [responsibleUseAcknowledgedAt]
            properties:
              responsibleUseAcknowledgedAt:
                type: integer
      properties:
        sessionId:
          type: string
        selectedCandidateId:
          type: string
          description: required; id of the chosen RankCandidate from a prior /recorder/rank (the ranked -> draft_created transition)
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$"
        writePolicy:
          type: string
          enum: [dry-run, write]
        responsibleUseAcknowledgedAt:
          type: [integer, "null"]
          description: required when writePolicy=write
        clientRequestId:
          type: [string, "null"]
      additionalProperties: false
      # H-002: /recorder/init is SELECT-ONLY. domain/strategy/endpoint/columns are
      # NOT accepted here — they are derived server-side from the selected RankCandidate
      # (selectedCandidateId) + recorder session state, then passed to High-Level
      # InitInput. This preserves the rank -> selectedCandidateId -> init invariant
      # (the candidate's EndpointDescriptor/ColumnDescriptor cannot be contradicted by a
      # free-form client payload). additionalProperties:false rejects stray overrides.
    VerifyRequest:
      type: object
      required: [sessionId, name]
      properties:
        sessionId:
          type: string
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$"
        executionSeedArgs:
          type: object
          additionalProperties: true
        fixture:
          type: string
          enum: [ignore, match, update]
        trace:
          type: string
          enum: [off, retain-on-failure, always]
        clientRequestId:
          type: [string, "null"]
    CancelRequest:
      type: object
      required: [scope]
      allOf:
        - if:
            properties:
              scope:
                const: request
            required: [scope]
          then:
            required: [requestId]
            properties:
              requestId:
                type: string
        - if:
            properties:
              scope:
                enum: [session, capture]
            required: [scope]
          then:
            required: [sessionId]
            properties:
              sessionId:
                type: string
      properties:
        requestId:
          type: [string, "null"]
        sessionId:
          type: [string, "null"]
        scope:
          type: string
          enum: [request, capture, session]
